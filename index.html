    <script>
      // Clear stale service worker caches if updating to ensure no white screen
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let reg of registrations) {
            reg.update();
          }
        });
      }
    </script>
